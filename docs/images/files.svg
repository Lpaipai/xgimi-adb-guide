<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img">
<title>files</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081726"/><stop offset="1" stop-color="#132e43"/></linearGradient></defs>
<rect width="1200" height="580" rx="24" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="68" font-size="36" fill="#ffffff" font-weight="700">文件放对位置，命令才能找到它</text><rect x="56" y="112" width="526" height="360" rx="18" fill="#13283b" stroke="#25455e"/><text x="82" y="159" font-size="29" fill="#61d6cf" font-weight="700">电脑：教程文件夹</text><text x="84" y="218" font-size="27" fill="#d5e3ef" font-weight="400">连接投影仪.cmd</text><text x="84" y="266" font-size="27" fill="#d5e3ef" font-weight="400">scripts / connect.ps1</text><text x="84" y="314" font-size="27" fill="#d5e3ef" font-weight="400">scripts / b.sh</text><text x="84" y="362" font-size="27" fill="#d5e3ef" font-weight="400">platform-tools / adb.exe</text><text x="84" y="410" font-size="27" fill="#d5e3ef" font-weight="400">docs / 图文说明</text><rect x="614" y="112" width="530" height="360" rx="18" fill="#13283b" stroke="#25455e"/><text x="640" y="159" font-size="29" fill="#61d6cf" font-weight="700">投影仪：内部共享存储</text><text x="640" y="235" font-size="38" fill="#ffffff" font-weight="700">/sdcard/b.sh</text><text x="640" y="302" font-size="25" fill="#d5e3ef" font-weight="400">把 U 盘中的 b.sh 复制到这里</text><text x="640" y="358" font-size="27" fill="#f5be65" font-weight="700">U 盘的 E: ≠ /sdcard</text><text x="640" y="410" font-size="26" fill="#d5e3ef" font-weight="400">不要变成 b.sh.txt</text><text x="56" y="535" font-size="26" fill="#d5e3ef" font-weight="400">Platform Tools 从 Android 官网单独下载；脚本已经在工具包中。</text></g></svg>