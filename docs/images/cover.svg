<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
<title>cover</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081726"/><stop offset="1" stop-color="#132e43"/></linearGradient></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="74" font-size="22" fill="#61d6cf" font-weight="700">FIELD NOTES  /  01</text><text x="64" y="160" font-size="60" fill="#ffffff" font-weight="700">极米 NEW Z6X</text><text x="64" y="238" font-size="60" fill="#ffffff" font-weight="700">把 ADB 真正连起来</text><text x="66" y="298" font-size="28" fill="#d5e3ef" font-weight="400">从 running，到电脑真正拿到 shell 权限。</text><rect x="64" y="348" width="1072" height="174" rx="18" fill="#13283b" stroke="#25455e"/><text x="92" y="395" font-size="26" fill="#61d6cf" font-weight="700">一次本地执行</text><text x="92" y="446" font-size="36" fill="#ffffff" font-weight="700">sh /sdcard/b.sh enable</text><text x="92" y="488" font-size="24" fill="#d5e3ef" font-weight="400">再用电脑连接工具，验证真实命令输出。</text><text x="64" y="578" font-size="25" fill="#d5e3ef" font-weight="400">已实测：Android 8 · v12.15.214 · m7221</text><text x="64" y="625" font-size="24" fill="#93b0c8" font-weight="400">限定固件  /  无需 Root  /  不刷机  /  不动应用与桌面</text></g></svg>