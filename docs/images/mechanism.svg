<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img">
<title>mechanism</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081726"/><stop offset="1" stop-color="#132e43"/></linearGradient></defs>
<rect width="1200" height="690" rx="24" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="68" font-size="36" fill="#ffffff" font-weight="700">最后补齐的是：服务 + 授权处理</text><rect x="56" y="112" width="1088" height="152" rx="18" fill="#13283b" stroke="#25455e"/><text x="80" y="155" font-size="29" fill="#f5be65" font-weight="700">① 让 adbd 接收网络连接</text><text x="80" y="200" font-size="26" fill="#d5e3ef" font-weight="400">service.adb.tcp.port = 5555</text><text x="80" y="238" font-size="24" fill="#93b0c8" font-weight="400">sys.usb.config = adb</text><rect x="56" y="288" width="1088" height="152" rx="18" fill="#13283b" stroke="#25455e"/><text x="80" y="331" font-size="29" fill="#61d6cf" font-weight="700">② 让 Android 框架读取启用状态</text><text x="80" y="376" font-size="26" fill="#d5e3ef" font-weight="400">persist.sys.usb.config = adb</text><text x="80" y="414" font-size="24" fill="#93b0c8" font-weight="400">重启一次框架 → 重新加载授权处理</text><rect x="56" y="464" width="1088" height="152" rx="18" fill="#13283b" stroke="#25455e"/><text x="80" y="507" font-size="29" fill="#61d6cf" font-weight="700">③ 电脑发起连接，设备处理公钥</text><text x="80" y="552" font-size="26" fill="#d5e3ef" font-weight="400">本机固件的相关分支自动允许有效公钥</text><text x="80" y="590" font-size="24" fill="#93b0c8" font-weight="400">电脑执行命令成功，完成验收</text><text x="56" y="655" font-size="22" fill="#93b0c8" font-weight="400">依据本机代码与实测；其他固件不保证适用。</text></g></svg>