<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img">
<title>states</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081726"/><stop offset="1" stop-color="#132e43"/></linearGradient></defs>
<rect width="1200" height="552" rx="24" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="68" font-size="36" fill="#ffffff" font-weight="700">别把这三个状态当成一回事</text><rect x="56" y="112" width="344" height="294" rx="18" fill="#13283b" stroke="#25455e"/><text x="80" y="156" font-size="25" fill="#f5be65" font-weight="700">01</text><text x="80" y="220" font-size="29" fill="#ffffff" font-weight="700">running</text><text x="80" y="283" font-size="24" fill="#d5e3ef" font-weight="400">后台服务已运行</text><text x="80" y="337" font-size="20" fill="#93b0c8" font-weight="400">还不能证明电脑已授权</text><rect x="428" y="112" width="344" height="294" rx="18" fill="#13283b" stroke="#25455e"/><text x="452" y="156" font-size="25" fill="#f5be65" font-weight="700">02</text><text x="452" y="220" font-size="29" fill="#ffffff" font-weight="700">unauthorized</text><text x="452" y="283" font-size="24" fill="#d5e3ef" font-weight="400">设备可达，授权未完成</text><text x="452" y="337" font-size="20" fill="#93b0c8" font-weight="400">一直等弹窗未必有用</text><rect x="800" y="112" width="344" height="294" rx="18" fill="#13283b" stroke="#25455e"/><text x="824" y="156" font-size="25" fill="#61d6cf" font-weight="700">03</text><text x="824" y="220" font-size="29" fill="#ffffff" font-weight="700">device + shell</text><text x="824" y="283" font-size="24" fill="#d5e3ef" font-weight="400">命令实际返回结果</text><text x="824" y="337" font-size="20" fill="#93b0c8" font-weight="400">这才是本教程的成功标准</text><text x="56" y="468" font-size="28" fill="#d5e3ef" font-weight="400">验收依据：电脑实际执行 id，得到 uid=2000(shell)。</text><text x="56" y="512" font-size="20" fill="#93b0c8" font-weight="400">示意图；不是伪造的终端截图。</text></g></svg>